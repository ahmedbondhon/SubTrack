<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>
<main class="container app-shell py-4 py-md-5">
<div class="form-card">
<div class="mb-4">
    <a class="text-decoration-none" th:href="@{/}">&larr; Back to Dashboard</a>
    <h1 class="mt-3 mb-1">Subscription details</h1>
    <p class="text-muted mb-0">Keep your renewal dates and recurring costs up to date.</p>
</div>
<form class="card shadow-sm p-4 p-md-5" th:action="@{/subscriptions/save}" th:object="${subscription}" method="post">
    <input type="hidden" th:field="*{id}" />

    <div class="row g-4">
    <div class="col-md-6">
    <label class="form-label" for="name">Name</label>
    <input class="form-control" id="name" type="text" th:field="*{name}" required />
    </div>

    <div class="col-md-6">
    <label class="form-label" for="category">Category</label>
    <input class="form-control" id="category" type="text" th:field="*{category}" required />
    </div>

    <div class="col-md-6">
    <label class="form-label" for="price">Price</label>
    <input class="form-control" id="price" type="number" step="0.01" th:field="*{price}" required />
    </div>

    <div class="col-md-6">
    <label class="form-label" for="billingCycle">Billing Cycle</label>
    <select class="form-select" id="billingCycle" th:field="*{billingCycle}">
        <option th:each="cycle : ${billingCycles}" th:value="${cycle}" th:text="${cycle}"></option>
    </select>
    </div>

    <div class="col-md-6">
    <label class="form-label" for="renewalDate">Renewal Date</label>
    <input class="form-control" id="renewalDate" type="date" th:field="*{renewalDate}" required />
    </div>

    <div class="col-md-6 d-flex align-items-end">
    <div class="form-check mb-2">
    <input class="form-check-input" id="active" type="checkbox" th:field="*{active}" />
    <label class="form-check-label" for="active">Active subscription</label>
    </div>
    </div>

    <div class="col-12 d-flex gap-2 pt-2">
    <button class="btn btn-primary" type="submit">Save subscription</button>
    <a class="btn btn-outline-secondary" th:href="@{/}">Cancel</a>
    </div>
    </div>
</form>
</div>
</main>
</body>
</html>
